<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kustom Widget Kumandası</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Gray-100 */
        }
        .tab-active {
            border-bottom: 2px solid #3b82f6; /* Blue-500 */
            color: #3b82f6;
            font-weight: 600;
        }
        .tab-inactive {
            color: #6b7280; /* Gray-500 */
            border-bottom: 2px solid transparent;
        }
        .tab-inactive:hover {
            color: #374151; /* Gray-700 */
            border-bottom: 2px solid #d1d5db; /* Gray-300 */
        }
        /* Custom scrollbar for textareas */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        /* Modal Animation */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden transition-all duration-300">
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white text-center relative">
            <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
                <i class="fa-solid fa-mobile-screen"></i> Kustom Remote
            </h1>
            <p class="text-blue-200 text-sm mt-1">Widget içeriklerini güncelleyin</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-gray-200">
            <button id="tab-mesaj" onclick="switchTab('mesaj')" class="flex-1 py-4 text-center tab-active transition-colors duration-200">
                <i class="fa-regular fa-message mr-2"></i>Mesaj
            </button>
            <button id="tab-dizi" onclick="switchTab('dizi')" class="flex-1 py-4 text-center tab-inactive transition-colors duration-200">
                <i class="fa-solid fa-film mr-2"></i>Dizi
            </button>
        </div>

        <!-- Content Area -->
        <div class="p-6">
            <!-- Mesaj Sekmesi İçeriği -->
            <div id="content-mesaj" class="space-y-5 block">
                
                <!-- Mesaj Gönderme Alanı -->
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700 flex items-center gap-2">
                        <i class="fa-solid fa-comment text-blue-500"></i> Metin Mesajı (Remote: message)
                    </label>
                    <textarea id="msg-text" rows="3" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow resize-none" placeholder="Widget'ta görünecek mesajı yazın..."></textarea>
                    <button onclick="sendData('message', 'msg-text')" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Mesaj Gönder
                    </button>
                </div>

                <hr class="border-gray-100">

                <!-- Mesaj Rengi Gönderme Alanı -->
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700 flex items-center gap-2">
                        <i class="fa-solid fa-palette text-blue-500"></i> Yazı Rengi (Remote: msgcolor)
                    </label>
                    <div class="flex gap-2">
                         <input type="text" id="msg-color" class="flex-1 px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow" placeholder="#FFFFFF veya red">
                         <button onclick="sendData('msgcolor', 'msg-color')" class="bg-blue-500 hover:bg-blue-600 text-white font-medium px-4 rounded-lg transition-colors">
                            <i class="fa-solid fa-paper-plane"></i>
                         </button>
                    </div>
                </div>

                <hr class="border-gray-100">

                <!-- Mesaj Fotoğrafı Gönderme Alanı -->
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700 flex items-center gap-2">
                        <i class="fa-regular fa-image text-blue-500"></i> Fotoğraf Linki (Remote: picturewb)
                    </label>
                    <input type="url" id="msg-pic" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow" placeholder="https://ornek.com/resim.jpg">
                    <button onclick="sendData('picturewb', 'msg-pic')" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Fotoğraf Gönder
                    </button>
                </div>
            </div>

            <!-- Dizi Sekmesi İçeriği -->
            <div id="content-dizi" class="space-y-4 hidden">
                
                <!-- Dizi Adı -->
                <div class="space-y-1">
                    <label class="block text-xs font-medium text-gray-700">Dizi Adı (Remote: diziadi)</label>
                    <div class="flex gap-2">
                        <input type="text" id="dizi-adi" class="flex-1 px-3 py-2 rounded-md border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none text-sm" placeholder="Örn: Breaking Bad">
                        <button onclick="sendData('diziadi', 'dizi-adi')" class="bg-purple-500 hover:bg-purple-600 text-white px-3 rounded-md transition-colors"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>

                <!-- Sezon -->
                <div class="space-y-1">
                    <label class="block text-xs font-medium text-gray-700">Sezon (Remote: sezon)</label>
                    <div class="flex gap-2">
                        <input type="text" id="dizi-sezon" class="flex-1 px-3 py-2 rounded-md border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none text-sm" placeholder="Örn: S01 veya Sezon 1">
                        <button onclick="sendData('sezon', 'dizi-sezon')" class="bg-purple-500 hover:bg-purple-600 text-white px-3 rounded-md transition-colors"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>

                <!-- Bölüm -->
                <div class="space-y-1">
                    <label class="block text-xs font-medium text-gray-700">Bölüm Adı/No (Remote: bolum)</label>
                    <div class="flex gap-2">
                        <input type="text" id="dizi-bolum" class="flex-1 px-3 py-2 rounded-md border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none text-sm" placeholder="Örn: E01 veya Pilot">
                        <button onclick="sendData('bolum', 'dizi-bolum')" class="bg-purple-500 hover:bg-purple-600 text-white px-3 rounded-md transition-colors"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>

                <hr class="border-gray-100 my-2">

                <!-- Dizi Fotoğrafı -->
                <div class="space-y-1">
                    <label class="block text-xs font-medium text-gray-700 flex items-center gap-1">
                        <i class="fa-regular fa-image text-purple-500"></i> Kapak Fotoğrafı Linki (Remote: picture)
                    </label>
                    <input type="url" id="dizi-pic" class="w-full px-3 py-2 rounded-md border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none text-sm" placeholder="https://ornek.com/kapak.jpg">
                    <button onclick="sendData('picture', 'dizi-pic')" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-medium py-2 mt-1 rounded-md transition-colors flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-paper-plane"></i> Kapak Fotoğrafını Gönder
                    </button>
                </div>
            </div>

            <!-- Status Notification Area -->
            <div id="toast-container" class="fixed bottom-4 right-4 flex flex-col gap-2 z-50 pointer-events-none">
                <!-- Toasts will be injected here -->
            </div>

        </div>
    </div>

    <script>
        // API_URL artık Kustom'un adresi değil, kendi yazdığımız proxy adresimiz
        const API_URL = "/api/proxy";

        /**
         * Sekmeler arası geçişi yönetir
         * @param {string} tabName - 'mesaj' veya 'dizi'
         */
        function switchTab(tabName) {
            const btnMesaj = document.getElementById('tab-mesaj');
            const btnDizi = document.getElementById('tab-dizi');
            const contentMesaj = document.getElementById('content-mesaj');
            const contentDizi = document.getElementById('content-dizi');

            if (tabName === 'mesaj') {
                // UI Güncelleme
                btnMesaj.className = 'flex-1 py-4 text-center tab-active transition-colors duration-200';
                btnDizi.className = 'flex-1 py-4 text-center tab-inactive transition-colors duration-200';
                
                // İçerik Göster/Gizle
                contentMesaj.classList.remove('hidden');
                contentMesaj.classList.add('block');
                contentDizi.classList.remove('block');
                contentDizi.classList.add('hidden');
            } else if (tabName === 'dizi') {
                // UI Güncelleme
                btnDizi.className = 'flex-1 py-4 text-center tab-active border-purple-500 text-purple-500 transition-colors duration-200 font-semibold';
                btnMesaj.className = 'flex-1 py-4 text-center tab-inactive transition-colors duration-200';
                
                // İçerik Göster/Gizle
                contentDizi.classList.remove('hidden');
                contentDizi.classList.add('block');
                contentMesaj.classList.remove('block');
                contentMesaj.classList.add('hidden');
            }
        }

        /**
         * Ekrana bildirim (toast) gösterir
         * @param {string} message - Bildirim metni
         * @param {string} type - 'success', 'error', 'info'
         */
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            // Animasyon başlangıç sınıfları
            toast.className = `px-4 py-3 rounded-lg shadow-lg text-white font-medium text-sm flex items-center gap-2 transform transition-all duration-300 translate-y-full opacity-0`;
            
            let iconClass = 'fa-solid fa-circle-check';
            if (type === 'success') {
                toast.classList.add('bg-green-500');
            } else if (type === 'error') {
                toast.classList.add('bg-red-500');
                iconClass = 'fa-solid fa-circle-exclamation';
            } else {
                toast.classList.add('bg-blue-500');
                iconClass = 'fa-solid fa-circle-info';
            }

            toast.innerHTML = `<i class="${iconClass}"></i> ${message}`;
            container.appendChild(toast);

            // Frame gecikmesi ile animasyonu tetikle (giriş)
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-full', 'opacity-0');
            });

            // Belirli bir süre sonra kaldır (çıkış)
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-full'); // Sağa doğru kaybolsun
                setTimeout(() => {
                    if (container.contains(toast)) {
                        container.removeChild(toast);
                    }
                }, 300); // CSS animasyon süresi kadar bekle
            }, 3000); // 3 saniye ekranda kal
        }

        /**
         * İlgili input alanından veriyi alıp Kustom API'sine gönderir.
         * @param {string} remoteKey - Kustom widget'ındaki değişken adı (örn: message, diziadi)
         * @param {string} inputId - Değerin okunacağı HTML elementinin ID'si
         */
        async function sendData(remoteKey, inputId) {
            const inputElement = document.getElementById(inputId);
            const value = inputElement.value.trim();

            if (!value) {
                showToast("Lütfen göndermeden önce bir değer girin.", "error");
                inputElement.focus();
                return;
            }

            // Butonu yükleniyor durumuna getir
            const btn = inputElement.nextElementSibling; 
            const originalBtnContent = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Gönderiliyor...`;
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            // API'ye gönderilecek JSON yapısını hazırla
            const payloadData = {};
            payloadData[remoteKey] = value;

            // DİKKAT: Artık 'tokens' kısmını göndermiyoruz. 
            // Onu backend (proxy.js) halledecek. Biz sadece veriyi gönderiyoruz.
            const payload = {
                "data": payloadData
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showToast(`'${remoteKey}' başarıyla güncellendi!`, 'success');
                } else {
                    console.error("API Hatası:", result.error);
                    showToast(`Hata oluştu: ${result.error || 'Bilinmeyen hata'}`, 'error');
                }
            } catch (error) {
                console.error("Ağ Hatası:", error);
                showToast("Bağlantı hatası oluştu. Lütfen internetinizi kontrol edin.", "error");
            } finally {
                // Butonu eski haline getir
                btn.innerHTML = originalBtnContent;
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
